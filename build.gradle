plugins {
    id 'base'
}

tasks.register('buildMods') {
    group = 'build'
    description = 'Builds every independently distributable mod jar.'
    dependsOn(
        ':mods:create-efficient-gauge:build',
        ':mods:create-handheld-cannon:build',
        ':mods:minecraft-frame-profiler:build'
    )
}

tasks.named('build') {
    dependsOn('buildMods', ':tools:jfr-analyzer:build')
}

tasks.named('clean') {
    dependsOn(
        ':mods:create-efficient-gauge:clean',
        ':mods:create-handheld-cannon:clean',
        ':mods:minecraft-frame-profiler:clean',
        ':tools:jfr-analyzer:clean'
    )
}
