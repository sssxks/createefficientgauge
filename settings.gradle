pluginManagement {
    includeBuild('build-logic')

    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'create-mod-suite'

include('mods:create-efficient-visuals')
include('mods:create-handheld-cannon')
include('mods:minecraft-frame-profiler')
include('tools:jfr-analyzer')
