plugins {
    id 'create-mods.neoforge-mod'
}

version = '0.1.2'

def modId = 'createefficientgauge'
def modName = 'Create Efficient Gauge'
def modAuthors = 'Create Efficient Gauge contributors'
def modDescription = 'Retained Flywheel rendering for Create factory gauges.'
def modLicense = 'AGPL-3.0-only'

base {
    archivesName = "${modId}-${minecraft_version}"
}

repositories {
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven {
        url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
    }
}

def withoutLocalMod = providers.gradleProperty('withoutLocalMod')
    .map { it.toBoolean() }
    .getOrElse(false)

// A control run needs a runtime classpath that contains the mod dependencies
// without also containing this mod's split classes/resources output.
if (withoutLocalMod) {
    sourceSets {
        control {
            java.setSrcDirs([])
            resources.setSrcDirs([])
        }
    }

    configurations {
        controlImplementation.extendsFrom(implementation)
        controlRuntimeOnly.extendsFrom(runtimeOnly)
    }

    configurations.matching {
        it.name == 'modDevRuntimeDependencies'
    }.all {
        configurations.controlRuntimeClasspath.extendsFrom(it)
    }
}

neoForge {
    runs {
        client {
            client()

            if (withoutLocalMod) {
                sourceSet = sourceSets.control
                loadedMods = []
            }

            def clientDir = providers
                .gradleProperty('clientGameDirectory')
                .getOrElse('runs/create-efficient-gauge')
            gameDirectory = rootProject.file(clientDir)

            def quickPlayWorld = providers
                .gradleProperty('quickPlaySingleplayer')
            if (quickPlayWorld.isPresent()) {
                programArgument('--quickPlaySingleplayer')
                programArgument(quickPlayWorld.get())
            }
        }

        integrationClient {
            client()
            gameDirectory = rootProject.file('runs/integration')
        }
    }

    mods {
        "${modId}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // 6.0.10-281 is the Maven publication corresponding to the public
    // Create 6.0.10 release (the user-facing mod version omits build 281).
    implementation(
        "com.simibubi.create:create-${minecraft_version}:${create_version}"
    ) {
        transitive = false
    }

    // Ponder requests Flywheel 1.0.4, while Create 6.0.10 requires 1.0.6.
    compileOnly(
        "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    )
    runtimeOnly(
        "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
    )

    implementation(
        "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    )
    implementation(
        "com.tterrag.registrate:Registrate:${registrate_version}"
    )
    implementation(
        "fuzs.forgeconfigapiport:forgeconfigapiport-common-neoforgeapi:${forgeconfigapiport_version}"
    )

    // Development-only: the production gauge mod does not depend on the
    // profiler, but this run exercises both independently packaged mods.
    integrationClientAdditionalRuntimeClasspath(
        project(':mods:minecraft-frame-profiler')
    )
}

processResources {
    def props = [
        mod_id: modId,
        mod_name: modName,
        mod_version: version,
        mod_authors: modAuthors,
        mod_description: modDescription,
        mod_license: modLicense,
        minecraft_version: minecraft_version,
        neo_version: neo_version
    ]
    inputs.properties(props)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(props)
    }
}
