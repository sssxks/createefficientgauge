<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <clipPath id="clip"><circle cx="256" cy="256" r="236"/></clipPath>
    <pattern id="stripes" width="92" height="92" patternUnits="userSpaceOnUse" patternTransform="rotate(45 256 256)">
      <rect width="46" height="92" fill="#3D80C8"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0A1E46" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <!-- white ring border -->
  <circle cx="256" cy="256" r="252" fill="#FFFFFF"/>

  <g clip-path="url(#clip)">
    <!-- blue disc with diagonal stripes -->
    <circle cx="256" cy="256" r="236" fill="#2E6BB0"/>
    <rect x="0" y="0" width="512" height="512" fill="url(#stripes)"/>
    <ellipse cx="180" cy="130" rx="170" ry="95" fill="#FFFFFF" opacity="0.07"/>
    <circle cx="256" cy="256" r="236" fill="url(#vig)"/>

    <!-- soft ground shadow -->
    <ellipse cx="292" cy="398" rx="112" ry="24" fill="#0F2A52" opacity="0.30"/>

    <!-- factory gauge (16x16 pixel grid, slightly tilted) -->
    <g transform="rotate(-8 256 256)">
      <g transform="translate(128 128) scale(16)">
        <rect x="2" y="0" width="12" height="1" fill="#46310F"/>
        <rect x="1" y="1" width="1" height="1" fill="#46310F"/><rect x="2" y="1" width="11" height="1" fill="#F6D97B"/><rect x="13" y="1" width="1" height="1" fill="#E3B347"/><rect x="14" y="1" width="1" height="1" fill="#46310F"/>
        <rect x="0" y="2" width="1" height="1" fill="#46310F"/><rect x="1" y="2" width="11" height="1" fill="#F6D97B"/><rect x="12" y="2" width="3" height="1" fill="#E3B347"/><rect x="15" y="2" width="1" height="1" fill="#46310F"/>
        <rect x="0" y="3" width="1" height="1" fill="#46310F"/><rect x="1" y="3" width="10" height="1" fill="#F6D97B"/><rect x="11" y="3" width="3" height="1" fill="#E3B347"/><rect x="14" y="3" width="1" height="1" fill="#A06F1D"/><rect x="15" y="3" width="1" height="1" fill="#46310F"/>
        <rect x="0" y="4" width="1" height="1" fill="#46310F"/><rect x="1" y="4" width="3" height="1" fill="#F6D97B"/><rect x="4" y="4" width="8" height="1" fill="#5E5E5E"/><rect x="12" y="4" width="1" height="1" fill="#E3B347"/><rect x="13" y="4" width="2" height="1" fill="#A06F1D"/><rect x="15" y="4" width="1" height="1" fill="#46310F"/>
        <rect x="0" y="5" width="1" height="1" fill="#46310F"/><rect x="1" y="5" width="3" height="1" fill="#F6D97B"/><rect x="4" y="5" width="1" height="1" fill="#5E5E5E"/><rect x="5" y="5" width="2" height="1" fill="#F2F2F2"/><rect x="7" y="5" width="3" height="1" fill="#D6D6D6"/><rect x="10" y="5" width="1" height="1" fill="#ACACAC"/><rect x="11" y="5" width="1" height="1" fill="#5E5E5E"/><rect x="12" y="5" width="3" height="1" fill="#A06F1D"/><rect x="15" y="5" width="1" height="1" fill="#46310F"/>
        <rect x="0" y="6" width="1" height="1" fill="#46310F"/><rect x="1" y="6" width="3" height="1" fill="#F6D97B"/><rect x="4" y="6" width="1" height="1" fill="#5E5E5E"/><rect x="5" y="6" width="1" height="1" fill="#F2F2F2"/><rect x="6" y="6" width="4" height="1" fill="#4F4F4F"/><rect x="10" y="6" width="1" height="1" fill="#ACACAC"/><rect x="11" y="6" width="1" height="1" fill="#5E5E5E"/><rect x="12" y="6" width="3" height="1" fill="#A06F1D"/><rect x="15" y="6" width="1" height="1" fill="#46310F"/>
        <rect x="0" y="7" width="1" height="1" fill="#46310F"/><rect x="1" y="7" width="3" height="1" fill="#F6D97B"/><rect x="4" y="7" width="1" height="1" fill="#5E5E5E"/><rect x="5" y="7" width="1" height="1" fill="#4F4F4F"/><rect x="6" y="7" width="2" height="1" fill="#FFFFFF"/><rect x="8" y="7" width="2" height="1" fill="#CFCFCF"/><rect x="10" y="7" width="1" height="1" fill="#4F4F4F"/><rect x="11" y="7" width="1" height="1" fill="#5E5E5E"/><rect x="12" y="7" width="3" height="1" fill="#A06F1D"/><rect x="15" y="7" width="1" height="1" fill="#46310F"/>
        <rect x="0" y="8" width="1" height="1" fill="#46310F"/><rect x="1" y="8" width="3" height="1" fill="#F6D97B"/><rect x="4" y="8" width="1" height="1" fill="#5E5E5E"/><rect x="5" y="8" width="1" height="1" fill="#4F4F4F"/><rect x="6" y="8" width="2" height="1" fill="#CFCFCF"/><rect x="8" y="8" width="2" height="1" fill="#8F8F8F"/><rect x="10" y="8" width="1" height="1" fill="#4F4F4F"/><rect x="11" y="8" width="1" height="1" fill="#5E5E5E"/><rect x="12" y="8" width="3" height="1" fill="#A06F1D"/><rect x="15" y="8" width="1" height="1" fill="#46310F"/>
        <rect x="0" y="9" width="1" height="1" fill="#46310F"/><rect x="1" y="9" width="3" height="1" fill="#F6D97B"/><rect x="4" y="9" width="1" height="1" fill="#5E5E5E"/><rect x="5" y="9" width="1" height="1" fill="#D6D6D6"/><rect x="6" y="9" width="4" height="1" fill="#4F4F4F"/><rect x="10" y="9" width="1" height="1" fill="#ACACAC"/><rect x="11" y="9" width="1" height="1" fill="#5E5E5E"/><rect x="12" y="9" width="3" height="1" fill="#A06F1D"/><rect x="15" y="9" width="1" height="1" fill="#46310F"/>
        <rect x="0" y="10" width="1" height="1" fill="#46310F"/><rect x="1" y="10" width="3" height="1" fill="#F6D97B"/><rect x="4" y="10" width="1" height="1" fill="#5E5E5E"/><rect x="5" y="10" width="6" height="1" fill="#ACACAC"/><rect x="11" y="10" width="1" height="1" fill="#5E5E5E"/><rect x="12" y="10" width="3" height="1" fill="#A06F1D"/><rect x="15" y="10" width="1" height="1" fill="#46310F"/>
        <rect x="0" y="11" width="1" height="1" fill="#46310F"/><rect x="1" y="11" width="2" height="1" fill="#F6D97B"/><rect x="3" y="11" width="1" height="1" fill="#E3B347"/><rect x="4" y="11" width="8" height="1" fill="#5E5E5E"/><rect x="12" y="11" width="3" height="1" fill="#A06F1D"/><rect x="15" y="11" width="1" height="1" fill="#46310F"/>
        <rect x="0" y="12" width="1" height="1" fill="#46310F"/><rect x="1" y="12" width="1" height="1" fill="#F6D97B"/><rect x="2" y="12" width="3" height="1" fill="#E3B347"/><rect x="5" y="12" width="10" height="1" fill="#A06F1D"/><rect x="15" y="12" width="1" height="1" fill="#46310F"/>
        <rect x="0" y="13" width="1" height="1" fill="#46310F"/><rect x="1" y="13" width="3" height="1" fill="#E3B347"/><rect x="4" y="13" width="11" height="1" fill="#A06F1D"/><rect x="15" y="13" width="1" height="1" fill="#46310F"/>
        <rect x="1" y="14" width="1" height="1" fill="#46310F"/><rect x="2" y="14" width="1" height="1" fill="#E3B347"/><rect x="3" y="14" width="11" height="1" fill="#A06F1D"/><rect x="14" y="14" width="1" height="1" fill="#46310F"/>
