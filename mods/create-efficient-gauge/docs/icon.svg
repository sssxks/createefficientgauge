    <!-- lightning bolt badge: speed / efficiency -->
    <g transform="rotate(10 350 334)">
      <g transform="translate(290 238) scale(12)">
        <path d="M6 0 L10 0 L6.5 6 L9.5 6 L2 16 L4 8 L1 8 Z" fill="#FFC82E" stroke="#5A3D00" stroke-width="1.1" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- inner edge shading of the disc -->
    <circle cx="256" cy="256" r="232" fill="none" stroke="#0A1E46" stroke-opacity="0.25" stroke-width="8"/>
  </g>
</svg>
