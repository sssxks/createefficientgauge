plugins {
    id 'create-mods.neoforge-mod'
}

version = '0.1.0'

def modId = 'createhandheldcannon'
def modName = 'Create: Handheld Cannon'
def modAuthors = 'Create Handheld Cannon contributors'
def modDescription = 'A handheld schematic cannon for Create.'
def modLicense = 'AGPL-3.0-only'

base {
    archivesName = "${modId}-${minecraft_version}"
}

repositories {
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
}

neoForge {
    runs {
        client {
            client()
            gameDirectory = rootProject.file('runs/create-handheld-cannon')
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = rootProject.file('runs/create-handheld-cannon-gametest')
        }
    }
    mods {
        "${modId}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}") {
        transitive = false
    }
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    implementation("fuzs.forgeconfigapiport:forgeconfigapiport-common-neoforgeapi:${forgeconfigapiport_version}")
}

processResources {
    def props = [
        mod_id: modId,
        mod_name: modName,
        mod_version: version,
        mod_authors: modAuthors,
        mod_description: modDescription,
        mod_license: modLicense,
        minecraft_version: minecraft_version,
        neo_version: neo_version
    ]
    inputs.properties(props)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(props)
    }
}
