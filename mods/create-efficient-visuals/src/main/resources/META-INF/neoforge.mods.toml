modLoader="javafml"
loaderVersion="[4,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
# The artwork is intentionally unchanged for the rename.
logoFile="assets/createefficientvisuals/icon.png"
description='''${mod_description}'''
displayTest="IGNORE_ALL_VERSION"

[[mixins]]
config="createefficientvisuals.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version},1.22)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="create"
type="required"
versionRange="[6.0.10,6.0.11)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="flywheel"
type="required"
versionRange="[1.0.6,2.0)"
ordering="AFTER"
side="CLIENT"
